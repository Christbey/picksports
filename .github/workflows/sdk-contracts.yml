name: SDK Contracts

on:
  pull_request:
    paths:
      - docs/openapi-v2.json
      - app/Console/Commands/Api/V2OpenApiGenerateCommand.php
      - routes/api-v2.php
      - .github/workflows/sdk-contracts.yml
      - scripts/prepare_sdk_spec.py
      - scripts/test_prepare_sdk_spec.py
  push:
    branches: [main]
    paths:
      - docs/openapi-v2.json
      - app/Console/Commands/Api/V2OpenApiGenerateCommand.php
      - routes/api-v2.php
      - .github/workflows/sdk-contracts.yml
      - scripts/prepare_sdk_spec.py
      - scripts/test_prepare_sdk_spec.py

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare compatible SDK contract
        run: |
          python3 -m unittest discover -s scripts -p test_prepare_sdk_spec.py
          python3 scripts/prepare_sdk_spec.py docs/openapi-v2.json build/sdk/openapi-v2.json
      - name: Generate TypeScript Fetch SDK
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/local" openapitools/openapi-generator-cli:v7.14.0 generate \
            -i /local/build/sdk/openapi-v2.json \
            -g typescript-fetch \
            -o /local/build/sdk/typescript \
            --additional-properties=npmName=@picksports/api-v2,supportsES6=true,typescriptThreePlus=true
      - name: Compile TypeScript SDK
        working-directory: build/sdk/typescript
        run: |
          npm install --ignore-scripts
          npm run build

  swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare compatible SDK contract
        run: python3 scripts/prepare_sdk_spec.py docs/openapi-v2.json build/sdk/openapi-v2.json
      - name: Generate Swift SDK
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/7.14.0/openapi-generator-cli-7.14.0.jar --output "$RUNNER_TEMP/openapi-generator.jar"
          echo "e03186835022ca02da4aa95e3967b6a3b6d44c2e5f7606e6d5c22466f519c757  $RUNNER_TEMP/openapi-generator.jar" | shasum --algorithm 256 --check
          java -jar "$RUNNER_TEMP/openapi-generator.jar" generate \
            -i build/sdk/openapi-v2.json \
            -g swift6 \
            -o build/sdk/swift \
            --additional-properties=projectName=PickSportsApiV2
      - name: Compile Swift SDK
        run: swift build --package-path build/sdk/swift

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare compatible SDK contract
        run: python3 scripts/prepare_sdk_spec.py docs/openapi-v2.json build/sdk/openapi-v2.json
      - name: Generate Kotlin SDK
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/local" openapitools/openapi-generator-cli:v7.14.0 generate \
            -i /local/build/sdk/openapi-v2.json \
            -g kotlin --library jvm-retrofit2 \
            -o /local/build/sdk/kotlin \
            --additional-properties=packageName=com.picksports.api.v2,useCoroutines=true
      - name: Compile Kotlin SDK
        working-directory: build/sdk/kotlin
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin --no-daemon
