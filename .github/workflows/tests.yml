name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Prepare Laravel Runtime Directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Discover Laravel Packages
        run: php artisan package:discover --ansi

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: composer test:ci

  ml:
    name: ${{ matrix.package }} ML tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [nfl, mlb]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/${{ matrix.package }}/requirements.lock.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --requirement ml/${{ matrix.package }}/requirements.lock.txt
          python -m pip install --no-deps --editable ml/${{ matrix.package }}

      - name: Run ML tests
        run: python -m pytest ml/${{ matrix.package }}/tests
