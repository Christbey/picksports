name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch to deploy to staging
        required: true
        default: main

jobs:
  deploy:
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    environment: staging
    runs-on: self-hosted
    steps:
      - name: Resolve target ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if ! git check-ref-format --branch "${REQUESTED_REF}" >/dev/null; then
              echo 'Invalid staging branch reference.' >&2
              exit 1
            fi
            echo "TARGET_REF=${REQUESTED_REF}" >> "$GITHUB_ENV"
          else
            echo "TARGET_REF=staging" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        run: /home/lab/docker/picksports/deploy.sh "${TARGET_REF}"
