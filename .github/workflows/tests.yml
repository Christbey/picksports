name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory-provenance:
    name: Review inventory provenance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'
      - run: python3 scripts/test_ml_runtime_contract.py

  mysql-integration:
    name: MySQL 8.4 integrity and concurrency lane ${{ matrix.lane }}/12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: 1
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/PredictionGeneratorSnapshotBoundaryTest.php tests/Integration/MySql/MlbArtifactCohortSerializationTest.php tests/Integration/MySql/CalculationRecoveryConcurrencyTest.php tests/Integration/MySql/MlbPeriodCaptureInstanceGuardTest.php tests/Integration/MySql/MlbObservedStartIntegrityTest.php tests/Integration/MySql/SettlementSnapshotTest.php tests/Integration/MySql/RestoredProductionMigrationUpgradeTest.php
          - lane: 2
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/EloSqlSessionClockAdmissionTest.php tests/Integration/MySql/FpiSeasonAcquisitionConcurrencyTest.php tests/Integration/MySql/GenericShadowPersistenceNativeTest.php tests/Integration/MySql/NflUnknownKickoffSchemaTest.php tests/Integration/MySql/NativeCredentialEpochCurrentStateTest.php tests/Integration/MySql/MlbPeriodMaterializationLockOrderTest.php tests/Integration/MySql/SportEventIdentitySnapshotTest.php tests/Integration/MySql/TeamSeasonPhaseIntegrityTest.php
          - lane: 3
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/EloTransitiveDependencySnapshotTest.php tests/Integration/MySql/FuturesSnapshotIndexRepairTest.php tests/Integration/MySql/ImmutableCoreCurrentStateTest.php tests/Integration/MySql/PasskeyCredentialSchemaTest.php tests/Integration/MySql/PlayIdentityConcurrencyTest.php tests/Integration/MySql/NativePushRegistrationSnapshotTest.php tests/Integration/MySql/StartingPitcherForecastCurrentStateTest.php tests/Feature/CBB/RosterObservationImmutabilityBoundaryTest.php
          - lane: 4
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/MlbExistingArtifactStorageTest.php tests/Integration/MySql/CbbCurrentEpaSourceTest.php tests/Integration/MySql/DatasetP2NativeBoundaryTest.php tests/Integration/MySql/AiDailyCommandAcknowledgementNativeTest.php tests/Integration/MySql/CfbSourceAssessmentSnapshotTest.php tests/Integration/MySql/PublicationEffectCurrentStateTest.php tests/Integration/MySql/SubmissionPageUrlCapacityTest.php tests/Integration/MySql/IndexAuditMetadataTest.php
          - lane: 5
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/BillingAdmissionIdentityTest.php tests/Integration/MySql/CfbKickoffObservationTest.php tests/Integration/MySql/EloBaselineAdmissionSnapshotTest.php tests/Integration/MySql/BillingFinancialConcurrencyTest.php tests/Integration/MySql/FiniteTokenEpochTest.php tests/Integration/MySql/StripeWebhookSnapshotTest.php tests/Integration/MySql/WnbaEloPublicationSnapshotTest.php
          - lane: 6
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/GroupMembershipAdmissionConcurrencyTest.php tests/Integration/MySql/DeveloperMeterPersistenceBoundaryTest.php tests/Integration/MySql/MlbTrainingCompletionConcurrencyTest.php tests/Integration/MySql/BillingRecoveryConcurrencyTest.php tests/Integration/MySql/GenericShadowCurrentClassificationTest.php tests/Integration/MySql/ApiIdempotencyConcurrencyTest.php tests/Integration/MySql/PlayerPropGradeSnapshotTest.php tests/Integration/MySql/BasketballLeaderboardPhaseIntegrityTest.php
          - lane: 7
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/MlbExistingArtifactSelectionTest.php tests/Integration/MySql/CfbPipelineStageGenerationBoundaryTest.php tests/Integration/MySql/CfbClosingEvidenceCurrentStateTest.php tests/Integration/MySql/MlbCompactMetadataCurrentStateTest.php tests/Integration/MySql/LegacyProbabilityPrecisionTest.php tests/Integration/MySql/BillingEffectiveEntitlementCurrentStateTest.php tests/Integration/MySql/PublicationSnapshotConcurrencyTest.php tests/Integration/MySql/CandidateCorrectionMigrationUpgradeTest.php
          - lane: 8
            selection: >-
              --testsuite="MySQL integration" tests/Integration/MySql/ProviderRefreshConcurrencyTest.php tests/Integration/MySql/EloCoordinatedWriterConcurrencyTest.php tests/Integration/MySql/CfbGenericWindowRecoveryTest.php tests/Integration/MySql/MlbInferenceOutputCommitTest.php tests/Integration/MySql/MatchupPublicationSnapshotTest.php tests/Integration/MySql/MlbCandidateSettlementSnapshotTest.php tests/Integration/MySql/ResultCorrectionSnapshotTest.php tests/Integration/MySql/PublicationEffectUpgradeTest.php
          - lane: 9
            selection: >-
              --testsuite="MySQL contracts" --shard=1/4
          - lane: 10
            selection: >-
              --testsuite="MySQL contracts" --shard=2/4
          - lane: 11
            selection: >-
              --testsuite="MySQL contracts" --shard=3/4
          - lane: 12
            selection: >-
              --testsuite="MySQL contracts" --shard=4/4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: picksports_test_readiness
          MYSQL_USER: picksports_test
          MYSQL_PASSWORD: testing-disposable
          MYSQL_ROOT_PASSWORD: testing-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_SOCKET: ''
      DB_DATABASE: picksports_test_readiness
      DB_USERNAME: picksports_test
      DB_PASSWORD: testing-disposable
      PICKSPORTS_TEST_MYSQL_DATABASE: picksports_test_readiness
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader
      - run: cp .env.example .env
      - run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs
      - run: php artisan key:generate --no-interaction
      - run: php artisan package:discover --ansi
      - name: Prepare disposable transaction-observation capability
        run: >-
          docker exec -e MYSQL_PWD=testing-root '${{ job.services.mysql.id }}'
          mysql --user=root --execute="
          GRANT SELECT ON performance_schema.events_transactions_current TO 'picksports_test'@'%';
          GRANT SELECT ON performance_schema.threads TO 'picksports_test'@'%';
          UPDATE performance_schema.setup_instruments SET ENABLED='YES', TIMED='YES' WHERE NAME='transaction';
          UPDATE performance_schema.setup_consumers SET ENABLED='YES' WHERE NAME='events_transactions_current';"
      - name: Record complete native discovery
        if: matrix.lane == 1
        run: |
          mkdir -p storage/framework/testing/mysql-results
          php -d memory_limit=1536M vendor/bin/pest --configuration=phpunit.mysql.xml --list-tests-xml=storage/framework/testing/mysql-results/full.xml --do-not-cache-result
      - name: Record native partition discovery
        run: |
          mkdir -p storage/framework/testing/mysql-results storage/framework/testing/mysql-preflight
          php -d memory_limit=1536M vendor/bin/pest --configuration=phpunit.mysql.xml ${{ matrix.selection }} --exclude-group=mysql-schema-preflight --list-tests-xml=storage/framework/testing/mysql-results/planned-${{ matrix.lane }}.xml --do-not-cache-result
          php -d memory_limit=1536M vendor/bin/pest --configuration=phpunit.mysql.xml --group=mysql-schema-preflight --list-tests-xml=storage/framework/testing/mysql-preflight/full.xml --do-not-cache-result
          cp storage/framework/testing/mysql-preflight/full.xml storage/framework/testing/mysql-preflight/planned-1.xml
      - name: Fail fast on native migration installation with strict safety proof
        env:
          PICKSPORTS_PHP_CI_EVENTS: storage/framework/testing/mysql-preflight/events-1.jsonl
        run: |
          php -d memory_limit=1536M vendor/bin/pest --configuration=phpunit.mysql.xml --group=mysql-schema-preflight --bootstrap=scripts/php-ci-bootstrap.php --log-junit=storage/framework/testing/mysql-preflight/junit-1.xml --stop-on-error --stop-on-failure --fail-on-empty-test-suite --do-not-cache-result --compact
          python3 scripts/verify-php-ci-results.py storage/framework/testing/mysql-preflight --shards=1
      - name: Credit the repeated schema safety contract once in the global catalog
        if: matrix.lane == 1
        run: |
          cp storage/framework/testing/mysql-preflight/planned-1.xml storage/framework/testing/mysql-results/planned-13.xml
          cp storage/framework/testing/mysql-preflight/events-1.jsonl storage/framework/testing/mysql-results/events-13.jsonl
          cp storage/framework/testing/mysql-preflight/junit-1.xml storage/framework/testing/mysql-results/junit-13.xml
      - name: Disposable MySQL partition with incremental canonical evidence
        env:
          PICKSPORTS_PHP_CI_EVENTS: storage/framework/testing/mysql-results/events-${{ matrix.lane }}.jsonl
        run: php -d memory_limit=1536M vendor/bin/pest --configuration=phpunit.mysql.xml ${{ matrix.selection }} --exclude-group=mysql-schema-preflight --bootstrap=scripts/php-ci-bootstrap.php --log-junit=storage/framework/testing/mysql-results/junit-${{ matrix.lane }}.xml --do-not-cache-result --profile --display-skipped
      - name: Upload native canonical results even after failure or timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-ci-results-${{ matrix.lane }}
          path: storage/framework/testing/mysql-results/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain repeated schema-safety observations without extra unique credit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-preflight-${{ matrix.lane }}
          path: storage/framework/testing/mysql-preflight/*
          if-no-files-found: error
          retention-days: 7

  mysql-ci:
    name: MySQL integrity completeness
    needs: [mysql-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mysql-ci-results-*
          path: mysql-ci-results
          merge-multiple: true
      - name: Verify all native contracts with one unique schema-preflight credit
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify-php-ci-results.py mysql-ci-results --shards=13 | tee -a "$GITHUB_STEP_SUMMARY"
          test '${{ needs.mysql-integration.result }}' = 'success'

  redis-pruning:
    name: Redis queue pruning contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis, pdo_sqlite
          tools: composer:v2
      - name: Install isolated fixture binaries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y redis-server
          redis-server --version
      - run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader
      - run: cp .env.example .env
      - run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs
      - run: php artisan key:generate --no-interaction
      - run: php artisan package:discover --ansi
      - name: Owned socket-only Redis fixture and real Lua contracts
        run: python3 scripts/test-redis-pruning.py

  browser-fixtures:
    name: Chromium synthetic user flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: cp .env.example .env
      - run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs
      - run: php artisan key:generate --no-interaction
      - run: php artisan package:discover --ansi
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Populated slate parity and settings interactions
        run: npm run test:browser:ci

  standalone-frontend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader
      - run: npm ci
      - name: Generate Laravel route helpers for root component tests
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs
          php artisan key:generate --no-interaction
          php artisan package:discover --ansi
          php artisan wayfinder:generate --with-form
      - run: npm run frontend:typecheck
      - run: npm run frontend:build
      - run: node --experimental-strip-types --test tests/frontend/*.test.mjs

  php:
    name: PHP 8.5 shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      XDEBUG_MODE: 'off'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1536M, post_max_size=16M

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php85-${{ hashFiles('composer.lock') }}

      - name: Verify Xdebug is disabled
        run: php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Xdebug must be disabled in the PHP test shards.\n"); exit(1); }'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Prepare Laravel Runtime Directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Discover Laravel Packages
        run: php artisan package:discover --ansi

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Build Assets
        run: npm run build

      - name: Record complete test discovery
        if: matrix.shard == 1
        run: php vendor/bin/pest --list-tests-xml=storage/framework/testing/full.xml

      - name: Record shard test discovery
        run: php vendor/bin/pest --testsuite=Architecture,Unit,Feature --exclude-group=ci-isolated-interop --shard=${{ matrix.shard }}/4 --list-tests-xml=storage/framework/testing/planned-${{ matrix.shard }}.xml

      - name: Tests
        env:
          PICKSPORTS_PHP_CI_EVENTS: storage/framework/testing/events-${{ matrix.shard }}.jsonl
        run: composer test:ci -- --bootstrap=scripts/php-ci-bootstrap.php --testsuite=Architecture,Unit,Feature --exclude-group=ci-isolated-interop --shard=${{ matrix.shard }}/4 --log-junit=storage/framework/testing/junit-${{ matrix.shard }}.xml --profile

      - name: Upload PHP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-ci-results-${{ matrix.shard }}
          path: |
            storage/framework/testing/*.xml
            storage/framework/testing/events-*.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed API v2 OpenAPI artifact
        if: matrix.shard == 1
        run: |
          php artisan api:v2-openapi-generate --output=/tmp/openapi-v2.json
          diff --unified docs/openapi-v2.json /tmp/openapi-v2.json

  php-sqlite:
    name: PHP 8.5 SQLite integration lane ${{ matrix.lane }}/7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            lane: 5
          - shard: 2
            lane: 6
    env:
      XDEBUG_MODE: 'off'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1536M, post_max_size=16M

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php85-${{ hashFiles('composer.lock') }}

      - name: Verify Xdebug is disabled
        run: php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Xdebug must be disabled in the PHP test shards.\n"); exit(1); }'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Prepare Laravel Runtime Directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Discover Laravel Packages
        run: php artisan package:discover --ansi

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Build Assets
        run: npm run build

      - name: Record shard test discovery
        run: php vendor/bin/pest --testsuite=SQLiteIntegration --exclude-group=ci-isolated-interop --shard=${{ matrix.shard }}/2 --list-tests-xml=storage/framework/testing/planned-${{ matrix.lane }}.xml

      - name: Tests
        env:
          PICKSPORTS_PHP_CI_EVENTS: storage/framework/testing/events-${{ matrix.lane }}.jsonl
        run: composer test:ci -- --bootstrap=scripts/php-ci-bootstrap.php --testsuite=SQLiteIntegration --exclude-group=ci-isolated-interop --shard=${{ matrix.shard }}/2 --log-junit=storage/framework/testing/junit-${{ matrix.lane }}.xml --profile

      - name: Upload PHP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-ci-results-${{ matrix.lane }}
          path: |
            storage/framework/testing/*.xml
            storage/framework/testing/events-*.jsonl
          if-no-files-found: error
          retention-days: 7

  php-isolated:
    name: PHP 8.5 isolated interoperability lane 7
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      XDEBUG_MODE: 'off'
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=128M, post_max_size=16M
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
          architecture: arm64
      - name: Bind owned interoperability paths
        run: |
          printf 'PICKSPORTS_NFL_NUMERIC_FIXTURE_ROOT=%s\n' "$RUNNER_TEMP/nfl-ci-interop" >> "$GITHUB_ENV"
          printf 'PICKSPORTS_NFL_NUMERIC_PYTHON=%s\n' "$RUNNER_TEMP/nfl-ci-venv/bin/python" >> "$GITHUB_ENV"
      - name: Verify isolated PHP platform contract
        run: |
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 && extension_loaded("pdo_sqlite") && extension_loaded("zip") ? 0 : 1);'
      - run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader
      - run: cp .env.example .env
      - run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs
      - run: php artisan key:generate --no-interaction
      - run: php artisan package:discover --ansi
      - name: Test portable fixture admission without scientific imports
        run: python -m unittest discover -s scripts -p test_prepare_nfl_ci_interop.py
      - name: Prepare tiny synthetic numeric interoperability fixture
        run: |
          test ! -e "$RUNNER_TEMP/nfl-ci-venv"
          python -m venv "$RUNNER_TEMP/nfl-ci-venv"
          "$PICKSPORTS_NFL_NUMERIC_PYTHON" -m pip --isolated install --only-binary=:all: --require-hashes --no-deps --requirement ml/runtime/requirements-linux-aarch64-cp312.lock
          "$PICKSPORTS_NFL_NUMERIC_PYTHON" -m pip --isolated install --no-deps --no-build-isolation --editable ml/nfl
          "$PICKSPORTS_NFL_NUMERIC_PYTHON" -m pip check
          "$PICKSPORTS_NFL_NUMERIC_PYTHON" scripts/prepare_nfl_ci_interop.py --output "$PICKSPORTS_NFL_NUMERIC_FIXTURE_ROOT"
      - name: Record isolated lane discovery at the actual caller limit
        run: >-
          php -d memory_limit=128M vendor/bin/pest
          tests/Feature/CFB/CfbSignalArtifactRecoveryTest.php tests/Feature/NFL/NflNumericBundleTest.php
          --group=ci-isolated-interop --list-tests-xml=storage/framework/testing/planned-7.xml
      - name: Execute only the four isolated contracts
        env:
          PICKSPORTS_PHP_CI_EVENTS: storage/framework/testing/events-7.jsonl
        run: >-
          php -d memory_limit=128M vendor/bin/pest
          tests/Feature/CFB/CfbSignalArtifactRecoveryTest.php tests/Feature/NFL/NflNumericBundleTest.php
          --group=ci-isolated-interop --bootstrap=scripts/php-ci-bootstrap.php
          --log-junit=storage/framework/testing/junit-7.xml --compact --display-skipped
      - name: Upload isolated PHP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-ci-results-7
          path: |
            storage/framework/testing/planned-7.xml
            storage/framework/testing/junit-7.xml
            storage/framework/testing/events-7.jsonl
          if-no-files-found: error
          retention-days: 7

  ci:
    name: ci (8.5)
    needs: [php, php-sqlite, php-isolated]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: php-ci-results-*
          path: php-ci-results
          merge-multiple: true
      - name: Test suite-completeness guard
        run: python -m unittest discover -s scripts -p 'test_verify_php_ci_results.py'
      - name: Verify complete PHP execution
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify-php-ci-results.py php-ci-results --shards=7 | tee -a "$GITHUB_STEP_SUMMARY"
          test '${{ needs.php.result }}' = 'success'
          test '${{ needs.php-sqlite.result }}' = 'success'
          test '${{ needs.php-isolated.result }}' = 'success'

  ml:
    name: ${{ matrix.package }} ML tests
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package: [nfl, mlb]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
          architecture: arm64

      - name: Install ML dependencies
        run: |
          test ! -e "$RUNNER_TEMP/ml-ci-${{ matrix.package }}"
          python -m venv "$RUNNER_TEMP/ml-ci-${{ matrix.package }}"
          "$RUNNER_TEMP/ml-ci-${{ matrix.package }}/bin/python" -m pip --isolated install --only-binary=:all: --require-hashes --no-deps --requirement ml/runtime/requirements-linux-aarch64-cp312.lock
          "$RUNNER_TEMP/ml-ci-${{ matrix.package }}/bin/python" -m pip --isolated install --no-deps --no-build-isolation --editable ml/${{ matrix.package }}
          "$RUNNER_TEMP/ml-ci-${{ matrix.package }}/bin/python" -m pip check

      - name: Run ML tests
        run: '"$RUNNER_TEMP/ml-ci-${{ matrix.package }}/bin/python" -m pytest ml/${{ matrix.package }}/tests'
