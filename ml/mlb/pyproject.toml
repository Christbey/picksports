[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "picksports-mlb-ml"
version = "0.2.0"
description = "Chronological MLB model training and inference for Picksports"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib==1.4.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "PyYAML==6.0.2",
    "scikit-learn==1.5.2",
    "xgboost-cpu==2.1.3; platform_system == 'Linux'",
    "xgboost==2.1.3; platform_system != 'Linux'",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
picksports-mlb-ml = "picksports_mlb_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
