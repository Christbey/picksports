schema_version: nfl-pregame-ml-v3

dataset:
  time_column: game_start_at
  season_column: season
  id_column: game_id
  reject_undeclared_feature_columns: false
  ignored_feature_columns:
    - feature_bookmaker_home_line
    - feature_game_date
    - feature_season
    - feature_version
  required_provenance_columns:
    - snapshot_run_id
    - model_run_id
    - config_hash
    - code_version
    - game_id
    - season
    - game_start_at
    - features_available_at
    - pregame_safe
    - availability_status
    - historical_profile
    - feature_version
    - feature_hash
    - target_hash

features:
  feature_home_elo: {type: float, nullable: false}
  feature_away_elo: {type: float, nullable: false}
  feature_elo_diff: {type: float, nullable: false}
  feature_adjusted_home_elo: {type: float, nullable: false}
  feature_home_field_advantage: {type: float, nullable: false}
  feature_week: {type: float, nullable: false}
  feature_season_type: {type: float, nullable: false}
  feature_neutral_site: {type: float, nullable: false}
  feature_kickoff_month: {type: float, nullable: false}
  feature_kickoff_day_of_week: {type: float, nullable: false}
  feature_model_predicted_spread: {type: float, nullable: false}
  feature_model_predicted_total: {type: float, nullable: false}
  feature_model_win_probability: {type: float, nullable: false}
  feature_confidence_score: {type: float, nullable: false}
  feature_market_home_spread: {type: float, nullable: true}
  feature_market_total: {type: float, nullable: true}

  feature_qb_form__applied: {type: float, nullable: false}
  feature_qb_form__home__score: {type: float, nullable: false}
  feature_qb_form__away__score: {type: float, nullable: false}
  feature_qb_form__home__experience: {type: float, nullable: false}
  feature_qb_form__away__experience: {type: float, nullable: false}
  feature_qb_form__home__prior_games: {type: float, nullable: false}
  feature_qb_form__away__prior_games: {type: float, nullable: false}
  feature_qb_form__home__prior_attempts: {type: float, nullable: false}
  feature_qb_form__away__prior_attempts: {type: float, nullable: false}
  feature_qb_form__home__prior_td_rate: {type: float, nullable: false}
  feature_qb_form__away__prior_td_rate: {type: float, nullable: false}
  feature_qb_form__home__prior_int_rate: {type: float, nullable: false}
  feature_qb_form__away__prior_int_rate: {type: float, nullable: false}
  feature_qb_form__home__prior_sack_rate: {type: float, nullable: false}
  feature_qb_form__away__prior_sack_rate: {type: float, nullable: false}
  feature_qb_form__home__prior_yards_per_attempt: {type: float, nullable: false}
  feature_qb_form__away__prior_yards_per_attempt: {type: float, nullable: false}
  feature_qb_form__home__prior_rush_yards_per_game: {type: float, nullable: false}
  feature_qb_form__away__prior_rush_yards_per_game: {type: float, nullable: false}
  feature_qb_form__raw_signal_spread: {type: float, nullable: true}

  feature_rolling_efficiency__applied: {type: float, nullable: false}
  feature_rolling_efficiency__home__games: {type: float, nullable: true}
  feature_rolling_efficiency__away__games: {type: float, nullable: true}
  feature_rolling_efficiency__home__avg_margin: {type: float, nullable: true}
  feature_rolling_efficiency__away__avg_margin: {type: float, nullable: true}
  feature_rolling_efficiency__home__yard_diff: {type: float, nullable: true}
  feature_rolling_efficiency__away__yard_diff: {type: float, nullable: true}
  feature_rolling_efficiency__home__recent_margin: {type: float, nullable: true}
  feature_rolling_efficiency__away__recent_margin: {type: float, nullable: true}
  feature_rolling_efficiency__home__turnover_diff: {type: float, nullable: true}
  feature_rolling_efficiency__away__turnover_diff: {type: float, nullable: true}
  feature_rolling_efficiency__signal_spread: {type: float, nullable: true}
  feature_rolling_efficiency__total_signal: {type: float, nullable: true}

  feature_line_matchup__applied: {type: float, nullable: false}
  feature_line_matchup__home__games: {type: float, nullable: true}
  feature_line_matchup__away__games: {type: float, nullable: true}
  feature_line_matchup__home_matchup_score: {type: float, nullable: true}
  feature_line_matchup__away_matchup_score: {type: float, nullable: true}
  feature_line_matchup__home_pressure_edge: {type: float, nullable: true}
  feature_line_matchup__away_pressure_edge: {type: float, nullable: true}
  feature_line_matchup__home_run_edge: {type: float, nullable: true}
  feature_line_matchup__away_run_edge: {type: float, nullable: true}
  feature_line_matchup__signal_spread: {type: float, nullable: true}
  feature_line_matchup__total_signal: {type: float, nullable: true}

  feature_contextual_factors__spread_adjustment: {type: float, nullable: false}
  feature_contextual_factors__total_adjustment: {type: float, nullable: false}
  feature_contextual_factors__schedule_spot__home__rest_days: {type: float, nullable: false}
  feature_contextual_factors__schedule_spot__away__rest_days: {type: float, nullable: false}
  feature_contextual_factors__schedule_spot__home__consecutive_road_games: {type: float, nullable: false}
  feature_contextual_factors__schedule_spot__away__consecutive_road_games: {type: float, nullable: false}
  feature_contextual_factors__home_away_strength__home__avg_margin: {type: float, nullable: false}
  feature_contextual_factors__home_away_strength__away__avg_margin: {type: float, nullable: false}
  feature_contextual_factors__home_away_strength__home__points_for: {type: float, nullable: false}
  feature_contextual_factors__home_away_strength__away__points_for: {type: float, nullable: false}
  feature_contextual_factors__home_away_strength__home__points_against: {type: float, nullable: false}
  feature_contextual_factors__home_away_strength__away__points_against: {type: float, nullable: false}
  feature_contextual_factors__division_rivalry__is_division_game: {type: float, nullable: false}
  feature_contextual_factors__division_rivalry__h2h__home_avg_margin: {type: float, nullable: false}
  feature_contextual_factors__same_week_records__home__team__win_pct: {type: float, nullable: false}
  feature_contextual_factors__same_week_records__away__team__win_pct: {type: float, nullable: false}
  feature_contextual_factors__prior_season_pedigree__home__regular_season__win_pct: {type: float, nullable: false}
  feature_contextual_factors__prior_season_pedigree__away__regular_season__win_pct: {type: float, nullable: false}

  feature_player_position_grades__home__summary__coverage_rate: {type: float, nullable: true}
  feature_player_position_grades__away__summary__coverage_rate: {type: float, nullable: true}
  feature_player_position_grades__home__summary__grade_confidence: {type: float, nullable: true}
  feature_player_position_grades__away__summary__grade_confidence: {type: float, nullable: true}
  feature_player_position_grades__home__summary__expected_grade_delta: {type: float, nullable: true}
  feature_player_position_grades__away__summary__expected_grade_delta: {type: float, nullable: true}

targets:
  home_win: target_home_win
  home_margin: target_home_margin
  total_points: target_total_points

training:
  seed: 20260726
  minimum_training_seasons: 5
  training_seasons_window: 4
  calibration_fit_fraction: 0.60
  final_test_seasons: 1
  logistic_regression:
    C: 0.5
    max_iter: 3000
  blend:
    max_challenger_weight: 0.50
  xgboost_classifier:
    n_estimators: 250
    max_depth: 3
    learning_rate: 0.035
    subsample: 0.85
    colsample_bytree: 0.80
    reg_lambda: 3.0
    min_child_weight: 5.0
  xgboost_regressor:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.035
    subsample: 0.85
    colsample_bytree: 0.80
    reg_lambda: 3.0
    min_child_weight: 5.0
  tuning:
    enabled: true
    trials_per_model: 4
    timeout_seconds_per_model: 180
    validation_seasons: 1
    n_jobs: 1
    search_space:
      n_estimators: [150, 350]
      max_depth: [2, 4]
      learning_rate: [0.02, 0.08]
      subsample: [0.75, 1.0]
      colsample_bytree: [0.70, 1.0]
      min_child_weight: [2.0, 10.0]
      reg_lambda: [1.0, 8.0]
      reg_alpha: [0.0001, 0.5]
  explanations:
    enabled: true
    max_rows: 128
