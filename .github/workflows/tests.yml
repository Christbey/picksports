name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standalone-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run frontend:typecheck
      - run: npm run frontend:build
      - run: node --experimental-strip-types --test tests/frontend/*.test.mjs

  php:
    name: PHP 8.5 shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      XDEBUG_MODE: 'off'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php85-${{ hashFiles('composer.lock') }}

      - name: Verify Xdebug is disabled
        run: php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Xdebug must be disabled in the PHP test shards.\n"); exit(1); }'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Prepare Laravel Runtime Directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/logs

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Discover Laravel Packages
        run: php artisan package:discover --ansi

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Build Assets
        run: npm run build

      - name: Record complete test discovery
        if: matrix.shard == 1
        run: php vendor/bin/pest --list-tests-xml=storage/framework/testing/full.xml

      - name: Record shard test discovery
        run: php vendor/bin/pest --shard=${{ matrix.shard }}/4 --list-tests-xml=storage/framework/testing/planned-${{ matrix.shard }}.xml

      - name: Tests
        run: composer test:ci -- --shard=${{ matrix.shard }}/4 --log-junit=storage/framework/testing/junit-${{ matrix.shard }}.xml --profile

      - name: Upload PHP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-ci-results-${{ matrix.shard }}
          path: storage/framework/testing/*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed API v2 OpenAPI artifact
        if: matrix.shard == 1
        run: |
          php artisan api:v2-openapi-generate --output=/tmp/openapi-v2.json
          diff --unified docs/openapi-v2.json /tmp/openapi-v2.json

  ci:
    name: ci (8.5)
    needs: php
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: php-ci-results-*
          path: php-ci-results
          merge-multiple: true
      - name: Test suite-completeness guard
        run: python -m unittest discover -s scripts -p 'test_verify_php_ci_results.py'
      - name: Verify complete PHP execution
        run: |
          python scripts/verify-php-ci-results.py php-ci-results --shards=4 | tee -a "$GITHUB_STEP_SUMMARY"
          test '${{ needs.php.result }}' = 'success'

  ml:
    name: ${{ matrix.package }} ML tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [nfl, mlb]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/${{ matrix.package }}/requirements.lock.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --requirement ml/${{ matrix.package }}/requirements.lock.txt
          python -m pip install --no-deps --editable ml/${{ matrix.package }}

      - name: Run ML tests
        run: python -m pytest ml/${{ matrix.package }}/tests
